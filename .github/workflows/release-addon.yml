name: Publish addon release

on:
  push:
    branches:
      - main
    paths:
      - "Resonance.toc"
      - ".github/workflows/release-addon.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a daily big-push version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^## Version: //p' "Resonance.toc" | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is a normal patch build; no public release."
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build install-ready ZIP
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Resonance"
          cp \
            "Resonance.toc" \
            "Bootstrap.lua" \
            "Rules_EvokerDruidShamanMonk.lua" \
            "Rules_PaladinDKDH.lua" \
            "Rules_MagePriestWarlock.lua" \
            "Rules_HunterRogueWarrior.lua" \
            "Rules_ArcaneFrost_12_1.lua" \
            "Rules_EvokerDH_12_1.lua" \
            "Rules_Generic.lua" \
            "Data.lua" \
            "BossVoices.lua" \
            "Sounds.lua" \
            "Presets_Generic.lua" \
            "Presets_MagePriestWarlock.lua" \
            "Presets_PaladinDKWarrior.lua" \
            "Presets_HunterRogueDH.lua" \
            "Presets_DruidShamanMonk.lua" \
            "Presets_Evoker.lua" \
            "Traits.lua" \
            "Audition.lua" \
            "Audio.lua" \
            "Core.lua" \
            "Options.lua" \
            "Tutorial.lua" \
            "Help.lua" \
            "Minimap.lua" \
            "Commands.lua" \
            "$STAGE/Resonance/"
          mkdir -p "$STAGE/Resonance/Assets"
          cp "Assets/ResonanceIcon.tga" "$STAGE/Resonance/Assets/"
          (
            cd "$STAGE"
            zip -qr "$GITHUB_WORKSPACE/Resonance.zip" "Resonance"
          )

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A corrected public build may keep its version while its ZIP is
            # rebuilt. Replace the asset so the permanent latest-download URL
            # always serves the current release commit.
            gh release upload "$TAG" "Resonance.zip" --clobber
            exit 0
          fi

          gh release create "$TAG" "Resonance.zip" \
            --target "$GITHUB_SHA" \
            --title "Resonance $VERSION" \
            --generate-notes
